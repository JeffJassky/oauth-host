name: CI

# Standalone, deliberately. The house plan is thin callers of reusable
# workflows in a shared repo — that repo does not exist yet, and a `uses:`
# pointing at nothing trades drift for red CI. See template/README.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A peer range is a claim, and an untested claim is a lie. Every major
        # in package.json's `peerDependencies` gets a job here, or the range
        # gets narrowed. See standards/traps.md #10.
        mongoose: ['7', '8', '9']
    name: test (mongoose ${{ matrix.mongoose }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # FIRST. Every later step passes against the working tree, which is
      # exactly the thing that lies when a global gitignore ate a file.
      # See standards/traps.md #1.
      - run: npm run check-tracked

      - run: npm run typecheck

      # --no-save keeps the lockfile authoritative for everything else.
      - run: npm install mongoose@${{ matrix.mongoose }} --no-save

      - run: npm run build
      - run: npm test

      # A host compiled to CommonJS can only `require()`, and an ESM-only
      # package fails there with ERR_REQUIRE_ESM. Prove the CJS half is real by
      # calling through it, not by checking the file exists.
      #
      # This does NOT check `import.meta.url` (traps #7): this package ships no
      # SPA, so nothing in it locates a bundle on disk. Put that back if a
      # future entry point ever reads from `__dirname`.
      - name: CJS entry actually loads
        run: node -e "const p=require('./dist/index.cjs'); if (typeof p.createOAuthHost !== 'function') process.exit(1)"
