name: Release

# The FIRST publish is manual and interactive — it needs a login and a 2FA OTP,
# and it must happen before npm's trusted publishing can be configured for the
# package. After that, tagging `v*` publishes with provenance and no secrets.
# See standards/publishing.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write              # required for npm trusted publishing OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optionally gate on a GitHub environment named "npm" — adds a manual
    # approval step before publish runs. Repo Settings → Environments → npm.
    # environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run check-tracked
      - run: npm run typecheck
      # Same ordering as prepublishOnly — build before test. traps #11.
      - run: npm run build
      - run: npm test
      # Trusted publishing requires npm >= 11.5.1. Node 22's bundled npm may
      # lag, and `npm install -g npm@latest` has a known self-upgrade race on
      # hosted runners — use npx so we don't mutate the global install.
      - run: npx -y npm@latest publish --provenance --access public
